<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Morndo mockup: catch-up, all caught up</title>
<link rel="stylesheet" href="mock.css">
<style>
  .end { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 26px; }
  /* The mark's own picture, drawn large: the sun over the horizon. */
  .sky { position: relative; height: 232px; margin: 6px -26px 22px; overflow: hidden; }
  .sky .sun { position: absolute; left: 50%; bottom: 40px; width: 164px; height: 164px; margin-left: -82px; border-radius: 50%; background: var(--ink); }
  .sky .band { position: absolute; left: 0; right: 0; bottom: 74px; height: 20px; background: var(--bg); }
  .sky .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: var(--bg); border-top: 1px solid var(--line); }
  .sky .ring { position: absolute; left: 50%; bottom: 40px; border: 1px solid var(--line); border-radius: 50%; transform: translate(-50%, 50%); }
  h1 { font: 600 38px/42px var(--display); letter-spacing: -0.02em; margin-top: 4px; }
  .sum { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .next { margin-top: 26px; padding: 18px 0 0; border-top: 1px solid var(--line); }
  .next .when { font: 600 54px/56px var(--display); letter-spacing: -0.03em; margin: 6px 0 4px; color: var(--text); }
  .next .say { font: 400 15px/22px var(--body); color: var(--muted); }
  .next .say b { color: var(--text); font-weight: 700; }
  .foot { flex: none; padding: 0 20px 6px; display: grid; gap: 10px; }
  .kept { display: flex; align-items: center; justify-content: center; gap: 8px; font: 400 14px/20px var(--body); color: var(--muted); }
</style>
</head>
<body>
  <div class="statusbar"><span>9:43</span><span class="right">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="23" height="12" rx="3.5" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor" stroke="none"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" fill="currentColor" stroke="none" opacity=".4"/></svg>
  </span></div>

  <div class="cu-top">
    <div class="row">
      <span class="back"><svg width="11" height="20" viewBox="0 0 11 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 1.5 10l8 8.5"/></svg></span>
      <span class="count">0 left<span>1 min 48 s</span></span>
      <span class="undo">Undo</span>
    </div>
    <div class="segments"><i class="decide done"></i><i class="decide done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i></div>
  </div>

  <div class="end">
    <div class="sky" aria-hidden="true">
      <span class="ring" style="width:250px;height:250px"></span>
      <span class="ring" style="width:340px;height:340px"></span>
      <span class="ring" style="width:440px;height:440px"></span>
      <span class="sun"></span><span class="band"></span><span class="ground"></span>
    </div>
    <p class="kicker">Saturday 3 October</p>
    <h1>You're caught up.</h1>
    <div class="sum">
      <span class="chip">2 decided</span><span class="chip">6 read</span><span class="chip">1 kept for later</span>
    </div>
    <div class="next">
      <p class="kicker">Nothing needs you until</p>
      <p class="when num">16:00</p>
      <p class="say"><b>Your slot: call the accountant</b>, about 20 minutes. Until then 4 agents keep working without you.</p>
    </div>
  </div>

  <div class="foot">
    <span class="btn primary block">See your day</span>
    <span class="kept"><span class="dot"></span>1 kept for later: the old-endpoint question</span>
  </div>
  <div class="homebar"><i></i></div>
</body>
</html>
