# Cut a release when Release Please merges to main (design §9, ADR-0019).
# A tag this workflow creates with GITHUB_TOKEN does not start another workflow, so build, sign and
# publish stay in this run. Job permissions replace the workflow permissions; they do not merge
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defining-access-for-the-github_token-permissions,
# read 2026-10-13).
#
# Pins, resolved from the release tags on 2026-10-13:
#   googleapis/release-please-action v5.0.0  45996ed1f6d02564a971a2fa1b5860e934307cf7
#   actions/checkout v7.0.1                   3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node v7.0.0                 820762786026740c76f36085b0efc47a31fe5020
#   actions/upload-artifact v7.0.1            043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact v7.0.0          37930b1c2abaa49bbe596cd826c3c89aef350131
#   actions/attest v4.2.2                     1e69f48acb82d1966a394da916b4c1698aa569d6
#   actions/upload-pages-artifact v5.0.0      fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages v5.0.1               368f82528645a54fb793d4d04e342629a3f51346
#   actions/create-github-app-token v3.3.0    64ab729a6294000f5aa4a4bc0b73d1f32bc45510
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morndo-release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # release-please-action v5.0.0 sets these from code. Its action.yml declares no outputs
      # (tag 45996ed1f6d02564a971a2fa1b5860e934307cf7, read 2026-10-13), so actionlint cannot see them.
      # actionlint-disable-next-line
      release_created: ${{ steps.release.outputs.release_created }}
      # actionlint-disable-next-line
      tag_name: ${{ steps.release.outputs.tag_name }}
      # actionlint-disable-next-line
      sha: ${{ steps.release.outputs.sha }}
      # actionlint-disable-next-line
      version: ${{ steps.release.outputs.version }}
    steps:
      # A pull request opened with GITHUB_TOKEN starts no workflows, so the required checks never run.
      # https://docs.github.com/en/actions/concepts/security/github_token (read 2026-10-13)
      # The app token opens the release PR. Secrets: RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  signers:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          if [ -s trust/release_allowed_signers ] && [ -s trust/feed_allowed_signers ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipping release: trust/release_allowed_signers or trust/feed_allowed_signers is not in the tree yet" >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [release-please, signers]
    if: needs.signers.outputs.ready == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    # Hosted runners: ubuntu-24.04, ubuntu-24.04-arm, macos-15 (Apple silicon).
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#choosing-runners-in-a-group
    # read 2026-10-13. Floating runner labels move; these three stay put.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    env:
      BUNDLED_NODE: "24.21.0"
      NODE_RELEASE_KEYS_COMMIT: "481637f813e912c4aa3622d7964ab426c97b8e8d" #gitleaks:allow
      VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: GnuPG on macOS
        if: runner.os == 'macOS'
        run: command -v gpgv >/dev/null || brew install gnupg

      - name: Node release keyring
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pubring.kbx" \
            "https://raw.githubusercontent.com/nodejs/release-keys/${NODE_RELEASE_KEYS_COMMIT}/gpg/pubring.kbx"

      - name: Verify and unpack Node
        run: sh scripts/release/verify-node.sh "$BUNDLED_NODE" "$PLATFORM" "$RUNNER_TEMP/node" "$RUNNER_TEMP/pubring.kbx"

      - name: Test, build and pack
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/node/bin:$PATH"
          node -v | grep -qx "v${BUNDLED_NODE}"
          npm ci
          # better-sqlite3 13.0.3 ships its prebuild and has no install script (gypfile false).
          # allowScripts keeps npm from running one (ADR-0005). If a later version adds scripts.install,
          # run that script on this Node, then load the module from the staged tree below.
          if node -e "const s=require('./node_modules/better-sqlite3/package.json').scripts||{}; if(!s.install) process.exit(1)"; then
            npm run install --prefix node_modules/better-sqlite3
          fi
          npx vitest run --project=units
          npm run build
          # Node will not strip types under node_modules (nodejs.org/docs/latest-v24.x/api/typescript.html,
          # "Type stripping in dependencies", v24.21.0, read 2026-10-13). Compile while typescript is installed.
          node scripts/release/main.ts compile --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/compiled"
          npm prune --omit=dev
          mtime=$(git log -1 --format=%ct "$RELEASE_SHA")
          node scripts/release/main.ts stage --repo "$GITHUB_WORKSPACE" --node "$RUNNER_TEMP/node" --dest "$RUNNER_TEMP/stage" --version "$VERSION" --compiled "$RUNNER_TEMP/compiled"
          ( cd "$RUNNER_TEMP/stage/app" && "$RUNNER_TEMP/node/bin/node" -e "require('better-sqlite3')(':memory:').close()" )
          for name in morndo morndo-fleet morndo-node morndo-job morndo-board morndo-keys; do
            "$RUNNER_TEMP/stage/bin/$name" --version
          done
          mkdir -p dist
          node scripts/release/main.ts pack --root "$RUNNER_TEMP/stage" --out "dist/morndo-${VERSION}-${PLATFORM}.tar.gz" --mtime "$mtime"
          cp "$RUNNER_TEMP/stage/files.json" "dist/files-${PLATFORM}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Manifest, stamp, sums
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          mtime=$(git log -1 --format=%ct "$RELEASE_SHA")
          published=$((mtime * 1000))
          node scripts/release/main.ts manifest \
            --version "$VERSION" --commit "$RELEASE_SHA" --published-at "$published" \
            --repository "$GITHUB_REPOSITORY" \
            --artifact "linux-x64=dist/morndo-${VERSION}-linux-x64.tar.gz" \
            --files "linux-x64=dist/files-linux-x64.json" \
            --artifact "linux-arm64=dist/morndo-${VERSION}-linux-arm64.tar.gz" \
            --files "linux-arm64=dist/files-linux-arm64.json" \
            --artifact "darwin-arm64=dist/morndo-${VERSION}-darwin-arm64.tar.gz" \
            --files "darwin-arm64=dist/files-darwin-arm64.json" \
            --out dist/manifest.json
          node scripts/release/main.ts stamp --version "$VERSION" --in install.sh --out dist/install.sh
          node scripts/release/main.ts sums --out dist/SHA256SUMS \
            "dist/morndo-${VERSION}-linux-x64.tar.gz" \
            "dist/morndo-${VERSION}-linux-arm64.tar.gz" \
            "dist/morndo-${VERSION}-darwin-arm64.tar.gz" \
            dist/manifest.json dist/install.sh
      - name: Sign
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SSH_KEY" > "$key"
          node scripts/release/main.ts sign --namespace release@morndo.github.io --key "$key" --in dist/manifest.json --out dist/manifest.json.sig --dest "$RUNNER_TEMP"
          node scripts/release/main.ts sign --namespace release@morndo.github.io --key "$key" --in dist/install.sh --out dist/install.sh.sig --dest "$RUNNER_TEMP"
          rm -f "$key"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/morndo-*.tar.gz
            dist/manifest.json
            dist/install.sh
            dist/SHA256SUMS
      - name: Upload the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/morndo-*.tar.gz \
            dist/manifest.json dist/manifest.json.sig \
            dist/install.sh dist/install.sh.sig \
            dist/SHA256SUMS

  outside:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Verify without the release secret
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -s trust/release_allowed_signers
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
          ssh-keygen -Y verify -f trust/release_allowed_signers -I release@morndo.github.io -n release@morndo.github.io -s "$RUNNER_TEMP/assets/manifest.json.sig" < "$RUNNER_TEMP/assets/manifest.json"
          ssh-keygen -Y verify -f trust/release_allowed_signers -I release@morndo.github.io -n release@morndo.github.io -s "$RUNNER_TEMP/assets/install.sh.sig" < "$RUNNER_TEMP/assets/install.sh"
          for f in "$RUNNER_TEMP/assets"/morndo-*.tar.gz "$RUNNER_TEMP/assets/manifest.json" "$RUNNER_TEMP/assets/install.sh" "$RUNNER_TEMP/assets/SHA256SUMS"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
            gh release verify-asset "$TAG" "$f"
          done
          gh release verify "$TAG"

  ship:
    needs: [release-please, outside]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish after the outside check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false

  feed:
    needs: [release-please, ship]
    concurrency:
      group: morndo-feed
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: feed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Latest feed, and an empty stable feed the first time
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          now=$(node -e "process.stdout.write(String(Date.now()))")
          mkdir -p site "$RUNNER_TEMP/release"
          gh release download "$TAG" --pattern manifest.json --dir "$RUNNER_TEMP/release"
          manifest_url="https://github.com/${repo}/releases/download/${TAG}/manifest.json"
          # The Contents API returns the git blob on branch feed.
          # https://docs.github.com/en/rest/repos/contents#get-repository-content (read 2026-10-13)
          fetch() {
            local file="$1" err
            if err=$(gh api -H "Accept: application/vnd.github.raw+json" \
                "/repos/${GITHUB_REPOSITORY}/contents/${file}?ref=feed" 2>&1 > "site/${file}"); then
              return 0
            fi
            rm -f "site/${file}"
            if printf '%s\n' "$err" | grep -q '404'; then return 1; fi
            printf '%s\n' "$err" >&2
            exit 1
          }
          if fetch latest.json; then
            fetch latest.json.sig || { echo "latest.json has no signature" >&2; exit 1; }
            test -s trust/feed_allowed_signers
            ssh-keygen -Y verify -f trust/feed_allowed_signers -I feed@morndo.github.io -n feed@morndo.github.io -s site/latest.json.sig < site/latest.json
            node scripts/release/main.ts feed-add --existing site/latest.json --channel latest --version "$VERSION" \
              --manifest "$RUNNER_TEMP/release/manifest.json" --manifest-url "$manifest_url" --now "$now" --key-set 1 --out site/latest.json
          else
            node scripts/release/main.ts feed-add --channel latest --version "$VERSION" \
              --manifest "$RUNNER_TEMP/release/manifest.json" --manifest-url "$manifest_url" --now "$now" --key-set 1 --out site/latest.json
          fi
          if fetch stable.json; then
            fetch stable.json.sig || { echo "stable.json has no signature" >&2; exit 1; }
            test -s trust/feed_allowed_signers
            ssh-keygen -Y verify -f trust/feed_allowed_signers -I feed@morndo.github.io -n feed@morndo.github.io -s site/stable.json.sig < site/stable.json
          else
            node scripts/release/main.ts feed-empty --channel stable --now "$now" --key-set 1 --out site/stable.json
          fi
          umask 077
          key="$RUNNER_TEMP/feed.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$FEED_SSH_KEY" > "$key"
          node scripts/release/main.ts sign --namespace feed@morndo.github.io --key "$key" --in site/latest.json --out site/latest.json.sig --dest "$RUNNER_TEMP"
          node scripts/release/main.ts sign --namespace feed@morndo.github.io --key "$key" --in site/stable.json --out site/stable.json.sig --dest "$RUNNER_TEMP"
          rm -f "$key"
          # One commit on branch feed, so the next read sees this seq.
          # https://docs.github.com/en/rest/git/commits#create-a-commit (read 2026-10-13)
          parent=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/feed" --jq .object.sha 2>/dev/null || true)
          tree_args=()
          for f in latest.json latest.json.sig stable.json stable.json.sig; do
            blob=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f content="$(base64 -w0 "site/${f}")" -f encoding=base64 --jq .sha)
            tree_args+=(-f "tree[][path]=${f}" -f "tree[][mode]=100644" -f "tree[][type]=blob" -f "tree[][sha]=${blob}")
          done
          tree=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" "${tree_args[@]}" --jq .sha)
          if [ -n "$parent" ]; then
            body=$(jq -n --arg tree "$tree" --arg parent "$parent" '{message:"Publish the channel feeds", tree:$tree, parents:[$parent]}')
          else
            body=$(jq -n --arg tree "$tree" '{message:"Publish the channel feeds", tree:$tree, parents:[]}')
          fi
          commit=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha <<< "$body")
          if [ -n "$parent" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/heads/feed" -f sha="$commit" > /dev/null
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/heads/feed -f sha="$commit" > /dev/null
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: feed
    concurrency:
      group: morndo-feed
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
