# Secret scan of the tree (not history). The gitleaks GitHub Action is under a
# commercial licence, so this job runs the MIT binary, pinned by checksum.
# actions/checkout v7.0.1, same pin as ci.yml.
# https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
name: Secrets

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: gitleaks 8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
