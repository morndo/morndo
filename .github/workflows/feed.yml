# Re-sign the live feeds once a week, and fail when a newer Node 24 is published (design §9.5, §9.3).
# Promotion and withdrawal are a later change. Job permissions replace the workflow permissions.
# Cron is Monday 06:17 UTC, off the hour.
#
# Pins, resolved from the release tags on 2026-10-13:
#   actions/checkout v7.0.1                3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node v7.0.0              820762786026740c76f36085b0efc47a31fe5020
#   actions/upload-artifact v7.0.1         043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact v7.0.0       37930b1c2abaa49bbe596cd826c3c89aef350131
#   actions/upload-pages-artifact v5.0.0   fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages v5.0.1            368f82528645a54fb793d4d04e342629a3f51346
name: Feed

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morndo-feed
  cancel-in-progress: false

jobs:
  # The re-sign is three jobs, as in the release workflow: prepare runs npm and holds no key, sign holds the
  # feed key and runs no npm (it checks the feeds in plain shell first), and the last pushes the signed feeds.
  resign-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      status: ${{ steps.prepare.outputs.status }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - id: prepare
        name: Verify the live feed, then prepare the next one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(node -e "process.stdout.write(String(Date.now()))")
          mkdir -p site
          if [ ! -s trust/feed_allowed_signers ]; then
            echo "skipping re-sign: trust/feed_allowed_signers is not in the tree yet" >&2
            echo "status=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(node scripts/release/main.ts feed-resign-prepare \
            --repository "$GITHUB_REPOSITORY" --dir site --now "$now" \
            --signers trust/feed_allowed_signers --scratch "$RUNNER_TEMP")
          if [ "$status" = absent ]; then
            echo "skipping re-sign: branch feed has no feed yet" >&2
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - if: steps.prepare.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-unsigned
          path: |
            site/latest.json
            site/stable.json
            site/feed-prepared.json
          if-no-files-found: error

  resign-sign:
    needs: resign-prepare
    if: needs.resign-prepare.outputs.status == 'ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: feed
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: feed-unsigned
          path: site
      - name: Check what will be signed
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: resign
          REPOSITORY: ${{ github.repository }}
        run: /bin/sh scripts/release/check-signing-feed.sh
      # The only step that holds the feed key.
      - name: Sign the feeds
        env:
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin
          umask 077
          key=$(/usr/bin/mktemp "$RUNNER_TEMP/sign.XXXXXXXX")
          trap '/bin/rm -f "$key"' EXIT
          printf '%s\n' "$FEED_SSH_KEY" > "$key"
          for name in latest stable; do
            file="site/${name}.json"
            # ssh-keygen keeps an existing .sig and exits 0, so refuse one, and check the new one.
            if [ -e "$file.sig" ]; then echo "refusing to sign: $file.sig already exists" >&2; exit 1; fi
            /usr/bin/ssh-keygen -Y sign -f "$key" -n feed@morndo.github.io "$file"
            /usr/bin/ssh-keygen -Y verify -f trust/feed_allowed_signers -I feed@morndo.github.io -n feed@morndo.github.io -s "$file.sig" < "$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-signatures
          path: |
            site/latest.json.sig
            site/stable.json.sig
          if-no-files-found: error

  resign:
    needs: resign-sign
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.commit.outputs.present }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: feed-unsigned
          path: site
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: feed-signatures
          path: site
      - id: commit
        name: Commit the feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/main.ts feed-commit --repository "$GITHUB_REPOSITORY" --dir site --signers trust/feed_allowed_signers --scratch "$RUNNER_TEMP"
          echo "present=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: resign
    if: needs.resign.result == 'success' && needs.resign.outputs.present == 'true'
    # Same group as the release workflow's pages job, so a re-sign cannot deploy over a newer release.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    # (read 2026-10-13)
    concurrency:
      group: morndo-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Rebuild the site from the feed head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/feed-site.ts --repository "$GITHUB_REPOSITORY" --dir site --signers trust/feed_allowed_signers
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  node-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Fail when a newer Node 24 exists
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/index.json" https://nodejs.org/dist/index.json
          node scripts/release/main.ts node-check --index "$RUNNER_TEMP/index.json"
