# Re-sign the live feeds once a week, and fail when a newer Node 24 is published (design §9.5, §9.3).
# Promotion and withdrawal are a later change. Job permissions replace the workflow permissions.
# Cron is Monday 06:17 UTC, off the hour.
#
# Pins, resolved from the release tags on 2026-10-13:
#   actions/checkout v7.0.1                3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node v7.0.0              820762786026740c76f36085b0efc47a31fe5020
#   actions/upload-pages-artifact v5.0.0   fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages v5.0.1            368f82528645a54fb793d4d04e342629a3f51346
name: Feed

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morndo-feed
  cancel-in-progress: false

jobs:
  resign:
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.resign.outputs.present }}
    timeout-minutes: 20
    environment: feed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - id: resign
        name: Verify the live feed, then re-sign
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
        run: |
          set -euo pipefail
          now=$(node -e "process.stdout.write(String(Date.now()))")
          mkdir -p site
          if [ ! -s trust/feed_allowed_signers ]; then
            echo "skipping re-sign: trust/feed_allowed_signers is not in the tree yet" >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/feed.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$FEED_SSH_KEY" > "$key"
          # https://docs.github.com/en/rest/repos/contents#get-repository-content (read 2026-10-13)
          if err=$(gh api -H "Accept: application/vnd.github.raw+json" \
              "/repos/${GITHUB_REPOSITORY}/contents/latest.json?ref=feed" 2>&1 > site/latest.json); then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            rm -f site/latest.json
            if printf '%s\n' "$err" | grep -q '404'; then
              echo "skipping re-sign: branch feed has no feed yet" >&2
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$err" >&2
            exit 1
          fi
          for channel in latest stable; do
            if [ "$channel" != latest ]; then
              gh api -H "Accept: application/vnd.github.raw+json" \
                "/repos/${GITHUB_REPOSITORY}/contents/${channel}.json?ref=feed" > "site/${channel}.json"
            fi
            gh api -H "Accept: application/vnd.github.raw+json" \
              "/repos/${GITHUB_REPOSITORY}/contents/${channel}.json.sig?ref=feed" > "site/${channel}.json.sig"
            ssh-keygen -Y verify -f trust/feed_allowed_signers -I feed@morndo.github.io -n feed@morndo.github.io -s "site/${channel}.json.sig" < "site/${channel}.json"
            node scripts/release/main.ts feed-resign --in "site/${channel}.json" --out "site/${channel}.json" --now "$now"
            node scripts/release/main.ts sign --namespace feed@morndo.github.io --key "$key" --in "site/${channel}.json" --out "site/${channel}.json.sig" --dest "$RUNNER_TEMP"
          done
          rm -f "$key"
          parent=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/feed" --jq .object.sha)
          tree_args=()
          for f in latest.json latest.json.sig stable.json stable.json.sig; do
            blob=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f content="$(base64 -w0 "site/${f}")" -f encoding=base64 --jq .sha)
            tree_args+=(-f "tree[][path]=${f}" -f "tree[][mode]=100644" -f "tree[][type]=blob" -f "tree[][sha]=${blob}")
          done
          tree=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" "${tree_args[@]}" --jq .sha)
          body=$(jq -n --arg tree "$tree" --arg parent "$parent" '{message:"Re-sign the channel feeds", tree:$tree, parents:[$parent]}')
          commit=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha <<< "$body")
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/heads/feed" -f sha="$commit" > /dev/null
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.resign.outputs.present == 'true'
        with:
          path: site

  pages:
    needs: resign
    if: needs.resign.result == 'success' && needs.resign.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  node-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Fail when a newer Node 24 exists
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/index.json" https://nodejs.org/dist/index.json
          node scripts/release/main.ts node-check --index "$RUNNER_TEMP/index.json"
