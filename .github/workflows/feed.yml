# Re-sign the live feeds once a week, and fail when a newer Node 24 is published (design §9.5, §9.3).
# Promotion and withdrawal are a later change. Job permissions replace the workflow permissions.
# Cron is Monday 06:17 UTC, off the hour.
#
# Pins, resolved from the release tags on 2026-10-13:
#   actions/checkout v7.0.1                3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node v7.0.0              820762786026740c76f36085b0efc47a31fe5020
#   actions/upload-pages-artifact v5.0.0   fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages v5.0.1            368f82528645a54fb793d4d04e342629a3f51346
name: Feed

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morndo-feed
  cancel-in-progress: false

jobs:
  resign:
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.resign.outputs.present }}
    timeout-minutes: 20
    environment: feed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - id: resign
        name: Verify the live feed, then re-sign
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
        run: |
          set -euo pipefail
          now=$(node -e "process.stdout.write(String(Date.now()))")
          mkdir -p site
          if [ ! -s trust/feed_allowed_signers ]; then
            echo "skipping re-sign: trust/feed_allowed_signers is not in the tree yet" >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/feed.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$FEED_SSH_KEY" > "$key"
          status=$(node scripts/release/main.ts feed-resign-branch \
            --repository "$GITHUB_REPOSITORY" --dir site --now "$now" \
            --key "$key" --signers trust/feed_allowed_signers --scratch "$RUNNER_TEMP")
          if [ "$status" = absent ]; then
            echo "skipping re-sign: branch feed has no feed yet" >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: resign
    if: needs.resign.result == 'success' && needs.resign.outputs.present == 'true'
    # Same group as the release workflow's pages job, so a re-sign cannot deploy over a newer release.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    # (read 2026-10-13)
    concurrency:
      group: morndo-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Rebuild the site from the feed head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/main.ts feed-site --repository "$GITHUB_REPOSITORY" --dir site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  node-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Fail when a newer Node 24 exists
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/index.json" https://nodejs.org/dist/index.json
          node scripts/release/main.ts node-check --index "$RUNNER_TEMP/index.json"
