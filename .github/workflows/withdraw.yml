# Withdraw a Release in both feeds: it stays in the list, marked, and machines stop being offered it (design §9.5).
# Manual. Job permissions replace the workflow permissions.
#
# Pins, resolved from the release tags on 2026-10-13:
#   actions/checkout v7.0.1                3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node v7.0.0              820762786026740c76f36085b0efc47a31fe5020
#   actions/upload-artifact v7.0.1         043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact v7.0.0       37930b1c2abaa49bbe596cd826c3c89aef350131
#   actions/upload-pages-artifact v5.0.0   fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages v5.0.1            368f82528645a54fb793d4d04e342629a3f51346
name: Withdraw

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to mark withdrawn in both feeds
        required: true
        type: string
      allow_empty_channel:
        description: Allow withdrawing the last Version a channel offers (the channel then offers nothing)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Prepare runs npm and holds no key (the withdraw environment is the first approval). Sign holds the feed key and
  # runs no npm (it checks the feeds in plain shell first; the feed environment is the second approval). The last
  # pushes the signed feeds.
  withdraw-prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: withdraw
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Mark the version withdrawn in both feeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ALLOW_EMPTY: ${{ inputs.allow_empty_channel }}
        run: |
          set -euo pipefail
          now=$(node -e "process.stdout.write(String(Date.now()))")
          mkdir -p site
          if [ ! -s trust/feed_allowed_signers ]; then
            echo "trust/feed_allowed_signers is missing" >&2
            exit 1
          fi
          node scripts/release/main.ts feed-withdraw-prepare \
            --repository "$GITHUB_REPOSITORY" --dir site --now "$now" \
            --signers trust/feed_allowed_signers --scratch "$RUNNER_TEMP" \
            --version "$VERSION" --allow-empty-channel "$ALLOW_EMPTY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-unsigned
          path: |
            site/latest.json
            site/stable.json
            site/feed-prepared.json
          if-no-files-found: error

  withdraw-sign:
    needs: withdraw-prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: feed
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed-unsigned
          path: site
      - name: Check what will be signed
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: withdraw
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          ALLOW_EMPTY_CHANNEL: ${{ inputs.allow_empty_channel }}
        run: /bin/sh scripts/release/check-signing-feed.sh
      # The only step that holds the feed key.
      - name: Sign the feeds
        env:
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin
          umask 077
          key=$(/usr/bin/mktemp "$RUNNER_TEMP/sign.XXXXXXXX")
          trap '/bin/rm -f "$key"' EXIT
          printf '%s\n' "$FEED_SSH_KEY" > "$key"
          for name in latest stable; do
            file="site/${name}.json"
            # ssh-keygen keeps an existing .sig and exits 0, so refuse one, and check the new one.
            if [ -e "$file.sig" ]; then echo "refusing to sign: $file.sig already exists" >&2; exit 1; fi
            /usr/bin/ssh-keygen -Y sign -f "$key" -n feed@morndo.github.io "$file"
            /usr/bin/ssh-keygen -Y verify -f trust/feed_allowed_signers -I feed@morndo.github.io -n feed@morndo.github.io -s "$file.sig" < "$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-signatures
          path: |
            site/latest.json.sig
            site/stable.json.sig
          if-no-files-found: error

  withdraw:
    needs: withdraw-sign
    if: github.ref == 'refs/heads/main'
    # Preparation and signing wait for approvals and write nothing, so they do not take this group.
    # A withdrawal can wait up to 30 days, and the feed expires after 14, so feed.yml's Monday re-sign must still run.
    # This job writes the feed. It verifies that the feed branch still points at the commit the preparation read
    # and fails safe, "the feed branch moved; run this job again", if a re-sign ran meanwhile.
    concurrency:
      group: morndo-feed
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.commit.outputs.present }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed-unsigned
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed-signatures
          path: site
      - id: commit
        name: Commit the feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/main.ts feed-commit --repository "$GITHUB_REPOSITORY" --dir site --signers trust/feed_allowed_signers --scratch "$RUNNER_TEMP"
          echo "present=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: withdraw
    if: github.ref == 'refs/heads/main' && needs.withdraw.result == 'success' && needs.withdraw.outputs.present == 'true'
    # Same group as the release workflow's pages job, so a withdrawal cannot deploy over a newer release.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    # (read 2026-10-13)
    concurrency:
      group: morndo-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Rebuild the site from the feed head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/feed-site.ts --repository "$GITHUB_REPOSITORY" --dir site --signers trust/feed_allowed_signers
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
